services:
  postgres:
    image: postgres:17
    container_name: ledger-service-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ledger_db
    ports:
      - "5433:5432"

